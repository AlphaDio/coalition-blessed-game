module:
  id: "event_11"
  name: "Sanctions Dispute"
  description: "One empire imposes sanctions on another empire"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["sanctions", "dispute", "economic"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_11"
    name: "Sanctions Dispute"
    description: "${sanctioner.name} has imposed economic sanctions on ${target.name} over disagreements about resource allocation and military strategy."
    variables:
      - type: empire
        select: random
        count: 1
        as: sanctioner
      - type: empire
        select: random
        count: 1
        exclude: ["$sanctioner"]
        as: target
    choices:
      - text: "Support ${sanctioner.name}'s sanctions"
        description: "Back the sanctions against ${target.name}. Boosts ${sanctioner.name}'s standing but isolates ${target.name} and hurts the economy."
        effects_summary: "${sanctioner.name} relations: +6 with all | ${target.name} relations: -12 with all | Production: -0.15 for 6 turns | Coalition cohesion: -3"
        effects:
          empireRelations:
            "$sanctioner":
              "@all": 6
            "$target":
              "@all": -12
          timedModifiers:
            empire_production_multiplier:
              value: -0.15
              duration: 6
          coalitionCohesion: -3
      - text: "Mediate the dispute"
        description: "Bring both sides to the table. A diplomatic solution that cools tensions between the two parties."
        effects_summary: "${sanctioner.name} ↔ ${target.name}: -4 bilateral relations"
        effects:
          empireRelations:
            "$sanctioner":
              "$target": -4
            "$target":
              "$sanctioner": -4
      - text: "Side with ${target.name}"
        description: "Reject the sanctions and support ${target.name}. Angers ${sanctioner.name} and causes some military disruption."
        effects_summary: "${target.name} relations: +8 with all | ${sanctioner.name} relations: -10 with all | Army organization: -3 for 4 turns"
        effects:
          empireRelations:
            "$target":
              "@all": 8
            "$sanctioner":
              "@all": -10
          timedModifiers:
            army_organization:
              value: -3
              duration: 4
