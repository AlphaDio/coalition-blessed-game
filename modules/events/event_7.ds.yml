module:
  id: "event_7"
  name: "Diplomatic Summit"
  description: "Empires gather to negotiate requisition fund allocation"
  version: "1.0.0"
  type: "event"
  category: "diplomatic"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["diplomatic", "requisitions", "allocation"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_7"
    name: "Diplomatic Summit"
    description: "The coalition leadership has called a diplomatic summit to reallocate requisition funds. ${favored.name} is arguing for preferential allocation to their war efforts."
    variables:
      - type: empire
        select: random
        count: 1
        as: favored
      - type: empire
        select: all
        exclude: ["$favored"]
        as: others
    choices:
      - text: "Grant ${favored.name} priority funds"
        description: "Redirect coalition resources to ${favored.name}'s war effort. Boosts their relations with everyone and increases total output."
        effects_summary: "Gain: +50 requisition | ${favored.name} relations: +8 with all"
        effects:
          empireRelations:
            "$favored":
              "@all": 8
          coalitionEconomy:
            requisition: 50
      - text: "Maintain equal distribution"
        description: "Keep the current allocation balanced. Everyone is moderately satisfied."
        effects_summary: "All empires: +5 approval | ${favored.name} relations: +4 with all"
        effects:
          empireApproval:
            "@all": 5
          empireRelations:
            "$favored":
              "@all": 4
      - text: "Centralize all funds"
        description: "Override individual allocations and pool everything centrally. Angers empires but consolidates resources."
        effects_summary: "Gain: +75 requisition | All empires: -10 approval | ${favored.name} relations: -8 with all"
        effects:
          empireApproval:
            "@all": -10
          empireRelations:
            "$favored":
              "@all": -8
          coalitionEconomy:
            requisition: 75
