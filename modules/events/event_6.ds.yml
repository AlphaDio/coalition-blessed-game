declares:
  event_data:
    id: "event_6"
    name: "Desertion Crisis"
    description: "Reports of desertions are increasing across coalition fleets and garrisons."
    choices:
      - text: "Increase pay and equipment"
        description: "Spend heavily on better pay, food, and gear to stem the desertions. Expensive but directly boosts morale."
        effects_summary: "Cost: 100 requisition | All armies: moderate fervor boost | All empires: moderate approval boost"
        effects:
          coalitionEconomy:
            requisition: -100
          armyFervor:
            "@all": 5
          empireApproval:
            "@all": 3
      - text: "Target support to weakest allies"
        description: "Focus aid on struggling empires and their forces. Moderate cost with broad benefits."
        effects_summary: "Cost: 50 requisition | Poorest empires: major approval boost | All armies: moderate fervor boost"
        effects:
          coalitionEconomy:
            requisition: -50
          empireApproval:
            "@poorest": 6
          armyFervor:
            "@all": 3
      - text: "Propaganda campaign"
        description: "Launch a morale-boosting media blitz. Inspires troops but citizens see through the messaging."
        effects_summary: "Cost: Free | All armies: major fervor boost | All empires: moderate approval drop"
        effects:
          armyFervor:
            "@all": 8
          empireApproval:
            "@all": -5

