module:
  id: "ability_public_mandate"
  name: "Public Mandate"
  description: "Rally public pressure into legislative momentum, at the cost of political heat."
  version: "1.1.0"
  type: "hero_ability"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "ability", "law", "pressure"]
  created_at: "2026-02-06T00:00:00Z"

schema_version: "0.1"

declares:
  hero_ability_data:
    id: "ABILITY_PUBLIC_MANDATE"
    description: "Convert popularity into law momentum/legitimacy while increasing hero heat."
    chargeRequired: 100
    cooldown: 10

hooks:
  on_trigger:
    description: "Push active law forward with public pressure; doing so generates hero heat."
    logic:
      - if:
          condition: "scope.law_process != null"
          then:
            - set_variable:
                varName: "legitimacy_bonus"
                value: "0.06 * scope.popularity_scalar"
            - set_variable:
                varName: "progress_bonus"
                value: "0.05 * scope.popularity_scalar"
            - if:
                condition: "vars.legitimacy_bonus > 0"
                then:
                  - game_action:
                      action: "add_law_meter"
                      args:
                        meter: "'legitimacy'"
                        amount: "vars.legitimacy_bonus"
                        log_message: "'Hero Ability: {hero} rallied public backing ({meter} {before}->{after}).'"
            - if:
                condition: "vars.progress_bonus > 0"
                then:
                  - game_action:
                      action: "add_law_progress"
                      args:
                        amount: "vars.progress_bonus"
                        log_message: "'Hero Ability: {hero} converted momentum into law progress {before} -> {after}.'"
      - set_variable:
          varName: "heat_cost"
          value: "3.0 * scope.popularity_scalar"
      - if:
          condition: "vars.heat_cost > 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'heat'"
                  amount: "vars.heat_cost"
                  log_message: "'Hero Ability: {hero} drew backlash (+{amount} heat).'"
      - set_variable:
          varName: "popularity_boost"
          value: "2.0 * scope.popularity_scalar"
      - if:
          condition: "vars.popularity_boost > 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'popularity'"
                  amount: "vars.popularity_boost"
