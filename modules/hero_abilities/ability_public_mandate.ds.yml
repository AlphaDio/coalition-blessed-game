module:
  id: "ability_public_mandate"
  name: "Public Mandate"
  description: "Convert popularity into short-term stability."
  version: "1.0.0"
  type: "hero_ability"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "ability", "stability"]
  created_at: "2026-02-02T00:00:00Z"

schema_version: "0.1"

declares:
  hero_ability_data:
    id: "ABILITY_PUBLIC_MANDATE"
    description: "Convert popularity into short-term stability: reduce heat/grievance, boost popularity."
    chargeRequired: 100
    cooldown: 10

hooks:
  on_trigger:
    description: "Reduce heat/grievance and boost popularity based on popularity scalar."
    logic:
      - set_variable:
          varName: "heat_reduction"
          value: "10 * scope.popularity_scalar"
      - set_variable:
          varName: "grievance_reduction"
          value: "6 * scope.popularity_scalar"
      - set_variable:
          varName: "popularity_boost"
          value: "4 * scope.popularity_scalar"
      - if:
          condition: "vars.heat_reduction != 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'heat'"
                  amount: "-vars.heat_reduction"
                  log_message: "'Hero Ability: {hero} invoked Public Mandate (heat reduced).'"
      - if:
          condition: "vars.grievance_reduction != 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'grievance'"
                  amount: "-vars.grievance_reduction"
      - if:
          condition: "vars.popularity_boost != 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'popularity'"
                  amount: "vars.popularity_boost"
