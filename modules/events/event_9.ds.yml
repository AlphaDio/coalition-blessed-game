module:
  id: "event_9"
  name: "Emergency Alliance"
  description: "Empires form temporary alliances during crisis"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["alliance", "crisis", "temporary"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_9"
    name: "Emergency Alliance"
    description: "With the Scourge threat intensifying, ${initiator.name} proposes forming temporary military alliances to coordinate defense efforts."
    variables:
      - type: empire
        select: random
        count: 1
        as: initiator
    choices:
      - text: "Form comprehensive alliance network (timed relations boost)"
        effects:
          empireRelations:
            "$initiator":
              "@all": 15
          timedModifiers:
            relations_strength_modifier:
              value: 0.5
              duration: 10
          coalitionCohesion: 5
      - text: "Create targeted alliances only (selective relations boost)"
        effects:
          empireRelations:
            "$initiator":
              "@all": 15
          timedModifiers:
            army_organization:
              value: 5
              duration: 5
      - text: "Decline alliances (maintain independence)"
        effects:
          empireRelations:
            "$initiator":
              "@all": -8
          scourgeCohesion: 3