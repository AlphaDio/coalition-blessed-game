module:
  id: "event_9"
  name: "Emergency Alliance"
  description: "Empires form temporary alliances during crisis"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["alliance", "crisis", "temporary"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_9"
    name: "Emergency Alliance"
    description: "With the Scourge threat intensifying, ${initiator.name} proposes forming temporary military alliances to coordinate defense efforts."
    variables:
      - type: empire
        select: random
        count: 1
        as: initiator
    choices:
      - text: "Form comprehensive alliance network"
        description: "Build a broad military alliance. Greatly improves ${initiator.name}'s relations and temporarily strengthens all diplomatic ties."
        effects_summary: "Cost: Free | ${initiator.name} relations: +14 with all | Relations strength: +0.5 for 10 turns"
        effects:
          empireRelations:
            "$initiator":
              "@all": 14
          timedModifiers:
            relations_strength_modifier:
              value: 0.5
              duration: 10
      - text: "Create targeted alliances only"
        description: "Form select military partnerships. Improves ${initiator.name}'s standing and temporarily boosts army discipline."
        effects_summary: "Cost: Free | ${initiator.name} relations: +10 with all | Army organization: +5 for 5 turns"
        effects:
          empireRelations:
            "$initiator":
              "@all": 10
          timedModifiers:
            army_organization:
              value: 5
              duration: 5
      - text: "Decline alliances"
        description: "Maintain independence from formal alliances. Disappoints ${initiator.name} and emboldens the Scourge."
        effects_summary: "${initiator.name} relations: -7 with all | Scourge cohesion: +3"
        effects:
          empireRelations:
            "$initiator":
              "@all": -7
          scourgeCohesion: 3
