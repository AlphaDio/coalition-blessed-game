module:
  id: "event_3"
  name: "Diplomatic Crisis"
  description: "Tensions rise between empires over resource allocation"
  version: "1.0.0"
  type: "event"
  category: "diplomatic"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["diplomatic", "crisis", "resources"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_3"
    name: "Diplomatic Crisis"
    description: "Tensions rise between coalition members over resource allocations and war priorities. ${favored.name} is demanding preferential treatment."
    variables:
      - type: empire
        select: random
        count: 1
        as: favored
      - type: empire
        select: all
        exclude: ["$favored"]
        as: others
    choices:
      - text: "Favor ${favored.name}"
        description: "Grant preferential resource allocation to ${favored.name}. Pleases them greatly but angers everyone else."
        effects_summary: "${favored.name}: +15 approval | Others: -8 approval"
        effects:
          empireApproval:
            "$favored": 15
            "$others": -8
      - text: "Maintain equal treatment"
        description: "Insist on fair distribution. Slightly frustrates everyone but preserves coalition unity."
        effects_summary: "All empires: -2 approval | Coalition cohesion: +3"
        effects:
          empireApproval:
            "@all": -2
          coalitionCohesion: 3

