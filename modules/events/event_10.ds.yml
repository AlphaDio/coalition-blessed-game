module:
  id: "event_10"
  name: "Trade Agreement"
  description: "Empires negotiate trade deals with ongoing benefits"
  version: "1.0.0"
  type: "event"
  category: "economic"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["trade", "agreement", "ongoing"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_10"
    name: "Trade Agreement"
    description: "${negotiator.name} has negotiated a comprehensive trade agreement that could provide ongoing economic benefits to participating empires."
    variables:
      - type: empire
        select: random
        count: 1
        as: negotiator
    choices:
      - text: "Ratify comprehensive trade agreement (timed economic boost)"
        effects:
          empireRelations:
            "$negotiator":
              "@all": 12
          timedModifiers:
            trade_income:
              value: 0.3
              duration: 15
          coalitionEconomy:
            requisition: 100
      - text: "Implement bilateral agreements (selective benefits)"
        effects:
          empireRelations:
            "$negotiator":
              "@all": 8
          timedModifiers:
            empire_production_multiplier:
              value: 0.2
              duration: 8
      - text: "Reject trade agreement (preserve requisition)"
        effects:
          empireRelations:
            "$negotiator":
              "@all": -8
          coalitionEconomy:
            requisition: 50