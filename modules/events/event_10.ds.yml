module:
  id: "event_10"
  name: "Trade Agreement"
  description: "Empires negotiate trade deals with ongoing benefits"
  version: "1.0.0"
  type: "event"
  category: "economic"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["trade", "agreement", "ongoing"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_10"
    name: "Trade Agreement"
    description: "${negotiator.name} has negotiated a comprehensive trade agreement that could provide ongoing economic benefits to participating empires."
    variables:
      - type: empire
        select: random
        count: 1
        as: negotiator
    choices:
      - text: "Ratify comprehensive trade agreement"
        description: "Sign the full trade deal. Boosts relations, provides immediate requisition, and increases trade income over time."
        effects_summary: "Gain: +100 requisition | ${negotiator.name} relations: +10 with all | Trade income: +0.3 for 15 turns"
        effects:
          empireRelations:
            "$negotiator":
              "@all": 10
          timedModifiers:
            trade_income:
              value: 0.3
              duration: 15
          coalitionEconomy:
            requisition: 100
      - text: "Implement bilateral agreements"
        description: "Negotiate smaller deals between specific partners. Moderate relations improvement and a temporary production boost."
        effects_summary: "Cost: Free | ${negotiator.name} relations: +7 with all | Production: +0.2 for 8 turns"
        effects:
          empireRelations:
            "$negotiator":
              "@all": 7
          timedModifiers:
            empire_production_multiplier:
              value: 0.2
              duration: 8
      - text: "Reject trade agreement"
        description: "Decline the deal. Damages ${negotiator.name}'s standing but keeps a small reserve of requisition."
        effects_summary: "Gain: +50 requisition | ${negotiator.name} relations: -7 with all"
        effects:
          empireRelations:
            "$negotiator":
              "@all": -7
          coalitionEconomy:
            requisition: 50
