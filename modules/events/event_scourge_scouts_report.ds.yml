module:
  id: "event_scourge_scouts_report"
  name: "Scout Report on Scourge Movement"
  description: "Coalition scouts have gathered intelligence on Scourge movements"
  version: "1.0.0"
  type: "event"
  category: "intelligence"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "intelligence", "reconnaissance"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_scouts_report"
    name: "Scout Report on Scourge Movement"
    description: "Coalition reconnaissance teams have detected Scourge force movements. Our scouts have gathered valuable intelligence about their likely next targets and timing."
    choices:
      - text: "Analyze thoroughly with full resources (costs 75 requisition, high confidence, fervor)"
        effects:
          coalitionEconomy:
            requisition: -75
          scourgePredictionConfidence: 0.35
          armyFervor:
            "@all": 5
      - text: "Share selectively with weaker allies (free, good confidence, boost struggling empires)"
        effects:
          empireApproval:
            "@poorest": 5
          scourgePredictionConfidence: 0.18
          coalitionCohesion: 1
      - text: "Keep findings internal (no cost, modest confidence)"
        effects:
          scourgePredictionConfidence: 0.12
          coalitionCohesion: 2
