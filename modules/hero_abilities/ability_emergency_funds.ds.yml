module:
  id: "ability_emergency_funds"
  name: "Emergency Funds"
  description: "Grant requisition to the Coalition."
  version: "1.0.0"
  type: "hero_ability"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "ability", "economy"]
  created_at: "2026-02-02T00:00:00Z"

schema_version: "0.1"

declares:
  hero_ability_data:
    id: "ABILITY_EMERGENCY_FUNDS"
    description: "Grant requisition to the Coalition."
    chargeRequired: 200
    cooldown: 8

hooks:
  on_trigger:
    description: "Grant requisition based on popularity."
    logic:
      - set_variable:
          varName: "grant"
          value: "round(100 * scope.popularity_scalar)"
      - if:
          condition: "vars.grant > 0"
          then:
            - game_action:
                action: "grant_requisition"
                args:
                  amount: "vars.grant"
                  log_message: "'Hero Ability: {hero} secured {value} requisition for the Coalition.'"
