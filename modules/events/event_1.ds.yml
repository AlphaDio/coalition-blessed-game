module:
  id: "event_1"
  name: "Requisition Convoy Attacked"
  description: "A requisition convoy has been ambushed by Scourge forces"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["requisition", "scourge", "combat"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_1"
    name: "Requisition Convoy Attacked"
    description: "A requisition convoy bound for coalition forces has been ambushed by Scourge forces. Analysis of the attack reveals information about Scourge tactics. How do you respond?"
    choices:
      - text: "Send reinforcements + analyze tactics (lose requisition, analyze patterns)"
        effects:
          coalitionEconomy:
            requisition: -100
          empireApproval:
            "@all": 5
          scourgePredictionConfidence: 0.15
      - text: "Abandon convoy but help struggling allies (free, boost weaker empires)"
        effects:
          empireApproval:
            "@poorest": 8
            "@richest": -8
      - text: "Ambush the ambushers (lose cohesion, learn from combat)"
        effects:
          coalitionCohesion: -5
          scourgePredictionConfidence: 0.2
          scourgeCohesion: -3
