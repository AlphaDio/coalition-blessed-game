module:
  id: "passive_fallout_start_credit_grant"
  name: "Breakthrough Dividend"
  description: "Convert home-empire tech breakthroughs into political capital."
  version: "1.1.0"
  type: "hero_passive"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "passive", "tech", "economy"]
  created_at: "2026-02-06T00:00:00Z"

schema_version: "0.1"

declares:
  hero_passive_data:
    id: "PASSIVE_FALLOUT_START_CREDIT_GRANT"
    description: "Grant credits when this hero's empire receives a technology."
    trigger:
      type: "TECH_UNLOCKED"
      require_empire_match: true

hooks:
  on_trigger:
    description: "Grant budget and optionally support an active law when a tech unlock lands."
    logic:
      - set_variable:
          varName: "grant"
          value: "round(900 * scope.popularity_scalar)"
      - if:
          condition: "vars.grant > 0"
          then:
            - game_action:
                action: "grant_credits"
                args:
                  amount: "vars.grant"
                  log_message: "'Hero Passive triggered: {hero} converted a breakthrough into {value} credits for {empire}.'"
      - if:
          condition: "scope.law_process != null"
          then:
            - set_variable:
                varName: "legitimacy_bonus"
                value: "0.02 * scope.popularity_scalar"
            - if:
                condition: "vars.legitimacy_bonus > 0"
                then:
                  - game_action:
                      action: "add_law_legitimacy"
                      args:
                        amount: "vars.legitimacy_bonus"
                        percent: "vars.legitimacy_bonus * 100"
                        log_message: "'Hero Passive triggered: {hero} framed the breakthrough as evidence (+{percent}% legitimacy).'"
