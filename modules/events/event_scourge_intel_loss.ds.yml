module:
  id: "event_scourge_intel_loss"
  name: "Lost Scout Team"
  description: "Coalition reconnaissance forces have been eliminated"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "loss", "intelligence"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_intel_loss"
    name: "Lost Scout Team"
    description: "A coalition reconnaissance team has been ambushed and eliminated by Scourge forces. Our intelligence gathering capabilities have been significantly weakened."
    choices:
      - text: "Reorganize and rebuild scouts (minor confidence loss, prepare for recovery)"
        effects:
          scourgePredictionConfidence: -0.2
          empireApproval:
            "@all": 2
      - text: "Acknowledge the loss and move on (accept reduced visibility)"
        effects:
          scourgePredictionConfidence: -0.3
      - text: "Launch rescue mission (confidence loss, potential casualties)"
        effects:
          scourgePredictionConfidence: -0.15
          coalitionCohesion: -5
