module:
  id: "ability_diplomatic_summit"
  name: "Diplomatic Summit"
  description: "Call a summit to strengthen coalition bonds."
  version: "1.0.0"
  type: "hero_ability"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "ability", "diplomacy", "cohesion"]
  created_at: "2026-03-13T00:00:00Z"

schema_version: "0.1"

declares:
  hero_ability_data:
    id: "ABILITY_DIPLOMATIC_SUMMIT"
    description: "Strengthen the coalition's cohesion through diplomatic outreach."
    chargeRequired: 150
    cooldown: 15

hooks:
  on_trigger:
    description: "Boost coalition cohesion and grant intel."
    logic:
      - set_variable:
          varName: "cohesion_boost"
          value: "round(3 * scope.popularity_scalar)"
      - if:
          condition: "vars.cohesion_boost > 0"
          then:
            - game_action:
                action: "adjust_coalition_cohesion"
                args:
                  amount: "vars.cohesion_boost"
                  log_message: "'Hero Ability: {hero} convened a diplomatic summit (+{value} coalition cohesion).'"
      - set_variable:
          varName: "intel_bonus"
          value: "round(2 * scope.popularity_scalar)"
      - if:
          condition: "vars.intel_bonus > 0"
          then:
            - game_action:
                action: "grant_intel"
                args:
                  amount: "vars.intel_bonus"
                  log_message: "'Hero Ability: {hero} gathered intelligence during the summit (+{value} intel).'"
      - set_variable:
          varName: "popularity_boost"
          value: "1.5"
      - if:
          condition: "vars.popularity_boost > 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'popularity'"
                  amount: "vars.popularity_boost"
                  log_message: "'Hero Ability: {hero} gained public favor from the summit (+{amount} popularity).'"
