module:
  id: "event_2"
  name: "Heroic Stand"
  description: "One of your armies has made a heroic stand against overwhelming odds"
  version: "1.0.0"
  type: "event"
  category: "military"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["heroic", "morale", "victory"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_2"
    name: "Heroic Stand"
    description: "Coalition forces have held a breach against overwhelming odds. The ${heroArmy.name} led the defense."
    variables:
      - type: army
        select: random
        count: 1
        as: heroArmy
    choices:
      - text: "Publicize the victory (gain fervor across the coalition)"
        effects:
          armyFervor:
            "@all": 10
      - text: "Rotate forces (trade fervor for reorganization)"
        effects:
          armyFervor:
            "@all": -5
