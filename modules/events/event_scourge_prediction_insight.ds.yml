  version: "1.0.0"
  type: "event"
  category: "military"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "strategic", "analysis"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_prediction_insight"
    name: "Strategic Insight into Scourge Patterns"
    description: "After analyzing numerous Scourge engagements, our military analysts believe they have identified patterns in the enemy's decision-making. This knowledge could help predict their next moves."
    choices:
      - text: "Distribute insights widely (costs 80 requisition, major confidence boost)"
        effects:
          coalitionEconomy:
            requisition: -80
          scourgePredictionConfidence: 0.4
          empireApproval:
            "@all": 2
      - text: "Share selectively with wealthy allies (free, good confidence, reward strong partners)"
        effects:
          empireApproval:
            "@richest": 5
          scourgePredictionConfidence: 0.2
      - text: "Classify for exclusive use (free, decent confidence but damage relations)"
        effects:
          empireApproval:
            "@all": -2
          scourgePredictionConfidence: 0.22
