module:
  id: "event_scourge_scouts_report"
  name: "Scout Report on Scourge Movement"
  description: "Coalition scouts have gathered intelligence on Scourge movements"
  version: "1.0.0"
  type: "event"
  category: "intelligence"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "intelligence", "reconnaissance"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_scouts_report"
    name: "Scout Report on Scourge Movement"
    description: "Coalition reconnaissance teams have detected Scourge force movements in the borderlands. Our scouts risked their lives to gather this intelligence, and their report details likely enemy targets and attack timing. How we use this information will affect our readiness and relations with member empires."
    choices:
      - text: "Full Analysis - Dedicate resources to comprehensive intelligence processing"
        description: "Deploy additional analysts and cross-reference all available data sources. Costly but provides the most accurate predictions and inspires our forces."
        effects_summary: "Cost: 75 requisition | Prediction confidence: +35% | All armies: +5 fervor"
        effects:
          coalitionEconomy:
            requisition: -75
          scourgePredictionConfidence: 0.35
          armyFervor:
            "@all": 5
      - text: "Share with Struggling Allies - Prioritize empires most in need"
        description: "Send detailed reports to our weakest member empires first. Builds goodwill with those who need help most while still improving our predictive capabilities."
        effects_summary: "Cost: Free | Prediction confidence: +18% | Poorest empires: +5 approval | Cohesion: +1"
        effects:
          empireApproval:
            "@poorest": 5
          scourgePredictionConfidence: 0.18
          coalitionCohesion: 1
      - text: "Internal Use Only - Classify the intelligence"
        description: "Keep the findings within Coalition command. Avoids political complications and maintains unity, though provides less actionable intelligence."
        effects_summary: "Cost: Free | Prediction confidence: +12% | Cohesion: +2"
        effects:
          scourgePredictionConfidence: 0.12
          coalitionCohesion: 2
