module:
  id: "event_8"
  name: "Resource Sharing Initiative"
  description: "One empire proposes sharing stockpiles with allies"
  version: "1.0.0"
  type: "event"
  category: "economic"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["resources", "sharing", "diplomatic"]
  created_at: "2026-01-24T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_8"
    name: "Resource Sharing Initiative"
    description: "${proposer.name} has proposed a resource sharing initiative to distribute coalition stockpiles more equitably among allies."
    variables:
      - type: empire
        select: random
        count: 1
        as: proposer
    choices:
      - text: "Implement full resource sharing"
        description: "Distribute coalition stockpiles equitably. Very expensive but greatly improves relations and approval across the board."
        effects_summary: "Cost: 200 requisition | ${proposer.name}: major relations boost with all | All empires: major approval boost"
        effects:
          empireRelations:
            "$proposer":
              "@all": 14
          coalitionEconomy:
            requisition: -200
          empireApproval:
            "@all": 10
      - text: "Selective sharing with close allies"
        description: "Share resources with select partners. No cost and moderately improves ${proposer.name}'s standing."
        effects_summary: "Cost: Free | ${proposer.name}: significant relations boost with all"
        effects:
          empireRelations:
            "$proposer":
              "@all": 7
      - text: "Reject the initiative"
        description: "Decline ${proposer.name}'s proposal and keep reserves centralized. Damages their reputation but saves resources."
        effects_summary: "Gain: +100 requisition | ${proposer.name}: major relations damage with all"
        effects:
          empireRelations:
            "$proposer":
              "@all": -12
          coalitionEconomy:
            requisition: 100
