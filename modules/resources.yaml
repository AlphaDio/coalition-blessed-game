resources:
  tiers:
    t1:
      name: "Tier 1"
      description: "Common bulk inputs; high volume; relatively stable pricing."
    t2:
      name: "Tier 2"
      description: "Strategic industrial goods; medium scarcity; moderate volatility."
    t3:
      name: "Tier 3"
      description: "Advanced goods; scarce; high leverage; higher volatility."
    t4:
      name: "Tier 4"
      description: "Economy-warping rarity; mostly event-driven; extreme leverage."

  tags:
    industrial: "Heavy manufacturing, hulls, and infrastructure."
    construction: "Fabrication inputs for building megastructures."
    military: "Weapons, armor, and war logistics."
    civilian: "Everyday goods that keep populations stable."
    fuel: "Energy and propulsion related inputs."
    sustenance: "Foodstock, water, and life support materials."
    logistics: "Transport, storage, and supply chain stability."
    coolant: "Thermal control and cryo systems."
    life_support: "Habitat and fleet life support inputs."
    electronics: "Circuitry, sensors, and computation."
    science: "Research, labs, and experimental work."
    medical: "Healthcare and biological enhancement."
    agriculture: "Food production and biological feedstock."
    biotech: "Genetic engineering and synthetic biology."
    culture: "Prestige, diplomacy, and heritage."
    strategic: "High leverage resources that shape policy or war."
    psychology: "Morale, influence, and cognitive control."
    repair: "Field repair and recovery systems."
    intel: "Command, prediction, and targeting."
    command: "Leadership, control, and coordination."
    ethics: "Sensitive or controversial technology."
    legendary: "Rare materials with mythic-scale impact."
    propulsion: "Drives and movement systems."
    megastructure: "Megastructure-scale construction inputs."
    energy: "Power generation and grid stability."

  commodities:

    - key: super_alloys
      name: "Super Alloys"
      tier: t1
      floor_price: 0.1
      tags: [industrial, construction, military]
      notes: "Structural metals, basic parts, hull plating."

    - key: biomass
      name: "Biomass"
      tier: t1
      floor_price: 0.08
      tags: [civilian, fuel, sustenance]
      notes: "Organics for foodstock, biofuels, basic bioprocessing."

    - key: plasma_fuel
      name: "Plasma Fuel"
      tier: t1
      floor_price: 0.05
      tags: [logistics, coolant, life_support]
      notes: "Water ice for life support, cooling, and process water."

    - key: rare_gases
      name: "Rare Gases"
      tier: t2
      floor_price: 0.5
      tags: [industrial, electronics, science]
      notes: "Lasers, lithography, plasma processing."

    - key: genomes
      name: "Genomes"
      tier: t2
      floor_price: 0.8
      tags: [medical, agriculture, biotech]
      notes: "Engineered genomes, therapies, bio-IP."

    - key: ancient_relics
      name: "Ancient Relics"
      tier: t2
      floor_price: 1.2
      tags: [science, culture, strategic]
      notes: "Fragments/artifacts leveraged for research, diplomacy, unlocks."

    - key: psycho_implants
      name: "Psycho Implants"
      tier: t2
      floor_price: 1.0
      tags: [medical, psychology, military]
      notes: "Psycho-active implants, neural enhancements, mind-control."

    - key: nano_machines
      name: "Nano Machines"
      tier: t3
      floor_price: 5.0
      tags: [industrial, repair, military]
      notes: "Advanced fabrication and repair swarms; elite sustainment."

    - key: quantum_circuits
      name: "Quantum Circuits"
      tier: t3
      floor_price: 7.5
      tags: [electronics, intel, command]
      notes: "Encryption, prediction, high-end comms and targeting."

    - key: sentient_cores
      name: "Sentient Cores"
      tier: t3
      floor_price: 10.0
      tags: [command, ethics, strategic]
      notes: "Sapient-grade computation; doctrine defining; high political impact."

    - key: wormhole_reactors
      name: "Wormhole Reactors"
      tier: t3
      floor_price: 15.0
      tags: [energy, propulsion, strategic]
      notes: "Exotic power cores used for extreme-range logistics and experimental drives."

    - key: dark_matter
      name: "Dark Matter"
      tier: t4
      floor_price: 100.0
      tags: [legendary, propulsion, megastructure]
      notes: "Ultra-rare; enables economy-warping tech and projects."

    - key: anti_grav_modules
      name: "Anti-Grav Modules"
      tier: t4
      floor_price: 80.0
      tags: [propulsion, megastructure, strategic]
      notes: "Advanced anti-grav systems; enables megastructures and planetary-scale projects."
