module:
  id: "ability_war_cry"
  name: "War Cry"
  description: "Rally the empire's armies, boosting fervor and organization."
  version: "1.0.0"
  type: "hero_ability"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "ability", "military", "morale"]
  created_at: "2026-03-13T00:00:00Z"

schema_version: "0.1"

declares:
  hero_ability_data:
    id: "ABILITY_WAR_CRY"
    description: "Rally the empire's armies with a surge of fervor and organization."
    chargeRequired: 130
    cooldown: 14

hooks:
  on_trigger:
    description: "Boost fervor and organization for the hero's empire armies."
    logic:
      - set_variable:
          varName: "fervor_boost"
          value: "round(8 * scope.popularity_scalar)"
      - if:
          condition: "vars.fervor_boost > 0"
          then:
            - game_action:
                action: "adjust_army_fervor"
                args:
                  amount: "vars.fervor_boost"
                  log_message: "'Hero Ability: {hero} rallied {empire} armies with a war cry (+{value} fervor).'"
      - set_variable:
          varName: "org_boost"
          value: "round(5 * scope.popularity_scalar)"
      - if:
          condition: "vars.org_boost > 0"
          then:
            - game_action:
                action: "adjust_army_organization"
                args:
                  amount: "vars.org_boost"
                  log_message: "'Hero Ability: {hero} tightened {empire} formations (+{value} organization).'"
      - set_variable:
          varName: "heat_cost"
          value: "2.0"
      - if:
          condition: "vars.heat_cost > 0"
          then:
            - game_action:
                action: "adjust_hero_meter"
                args:
                  meter: "'heat'"
                  amount: "vars.heat_cost"
                  log_message: "'Hero Ability: {hero} drew political heat for warmongering (+{amount} heat).'"
