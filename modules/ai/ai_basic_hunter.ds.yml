module:
  id: "ai_basic_hunter"
  name: "Basic Hunter AI"
  description: "Simple AI that seeks and attacks the nearest enemy"
  version: "1.0.0"
  type: "ai"
  category: "behavior"
  dependencies: []

metadata:
  author: "Sacrifice Team"
  tags: ["ai", "hunter", "basic"]
  created_at: "2025-12-30T18:00:00Z"

schema_version: "0.1"

functions:
  choose_target:
    description: "Find the best target to attack"
    parameters:
      self:
        type: "entity"
      scene:
        type: "scene"
    return_type: "entity"
    logic:
      - set_variable:
          varName: "enemies"
          value: "query_entities(scene, 'enemy')"
      - let:
          name: "nearest"
          value: "null"
      - let:
          name: "min_distance"
          value: "999999"
      - for_each:
          collection: "vars.enemies"
          as: "enemy"
          do:
            - set_variable:
                varName: "dist"
                value: "distance(params.self.position, vars.enemy.position)"
            - if:
                condition: "vars.dist < vars.min_distance"
                then:
                  - set_variable:
                      varName: "nearest"
                      value: "vars.enemy"
                  - set_variable:
                      varName: "min_distance"
                      value: "vars.dist"
      - return: "vars.nearest"

  should_retreat:
    description: "Check if the entity should retreat"
    parameters:
      self:
        type: "entity"
    return_type: "boolean"
    logic:
      - set_variable:
          varName: "health_percent"
          value: "params.self.stats.hp / params.self.stats.maxHp"
      - return: "vars.health_percent < 0.3"

  find_retreat_position:
    description: "Find a safe position to retreat to"
    parameters:
      self:
        type: "entity"
      scene:
        type: "scene"
    return_type: "vector3"
    logic:
      - set_variable:
          varName: "allies"
          value: "query_entities(scene, params.self.faction)"
      - let:
          name: "retreat_pos"
          value: "params.self.position"
      - if:
          condition: "len(vars.allies) > 0"
          then:
            # Retreat towards nearest ally
            - set_variable:
                varName: "nearest_ally"
                value: "get(vars.allies, 0)"
            - set_variable:
                varName: "retreat_pos"
                value: "vars.nearest_ally.position"
      - return: "vars.retreat_pos"
