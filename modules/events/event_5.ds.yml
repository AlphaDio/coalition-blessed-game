module:
  id: "event_5"
  name: "Resource Discovery"
  description: "A new resource cache has been discovered"
  version: "1.0.0"
  type: "event"
  category: "economy"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["resources", "discovery", "economy"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_5"
    name: "Requisition Discovery"
    description: "A cache of coalition requisition funds has been discovered."
    choices:
      - text: "Secure immediately"
        description: "Seize the full cache for coalition reserves. Maximum economic gain."
        effects_summary: "Gain: +200 requisition"
        effects:
          coalitionEconomy:
            requisition: 200
      - text: "Distribute to struggling allies"
        description: "Share the discovery with empires most in need. Less requisition but builds strong goodwill."
        effects_summary: "Gain: +50 requisition | Poorest empires: major approval boost"
        effects:
          coalitionEconomy:
            requisition: 50
          empireApproval:
            "@poorest": 12
      - text: "Reward strong partners"
        description: "Allocate bonus resources to wealthy allies. Moderate requisition gain and strengthens key relationships."
        effects_summary: "Gain: +75 requisition | Richest empires: major approval boost"
        effects:
          coalitionEconomy:
            requisition: 75
          empireApproval:
            "@richest": 10

