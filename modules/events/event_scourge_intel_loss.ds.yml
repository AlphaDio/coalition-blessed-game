module:
  id: "event_scourge_intel_loss"
  name: "Lost Scout Team"
  description: "Coalition reconnaissance forces have been eliminated"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "loss", "intelligence"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_intel_loss"
    name: "Lost Scout Team"
    description: "A coalition reconnaissance team has been ambushed and eliminated by Scourge forces. Our intelligence gathering capabilities have been significantly weakened."
    choices:
      - text: "Rapid rebuild with all available resources (costs 100 requisition, minimal intel loss, boost morale)"
        effects:
          coalitionEconomy:
            requisition: -100
          scourgePredictionConfidence: -0.12
          coalitionCohesion: 3
      - text: "Request allied support (free, moderate intel loss, slight approval cost)"
        effects:
          empireApproval:
            "@all": -1
          scourgePredictionConfidence: -0.22
          coalitionCohesion: 1
      - text: "Accept the loss peacefully (free, significant intel loss but maintain stability)"
        effects:
          scourgePredictionConfidence: -0.35
          coalitionCohesion: 2
