module:
  id: "passive_battle_start_warchest"
  name: "Battlefield Warchest"
  description: "Grant credits when a Scourge battle begins."
  version: "1.1.0"
  type: "hero_passive"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "passive", "battle", "economy"]
  created_at: "2026-02-06T00:00:00Z"

schema_version: "0.1"

declares:
  hero_passive_data:
    id: "PASSIVE_BATTLE_START_WARCHEST"
    description: "Grant credits when a Scourge battle begins."
    trigger:
      type: "BATTLE_STARTED"
      battle_type: "SCOURGE"

hooks:
  on_trigger:
    description: "Grant credits when a battle begins."
    logic:
      - set_variable:
          varName: "grant"
          value: "round(600 * scope.popularity_scalar)"
      - if:
          condition: "vars.grant > 0"
          then:
            - game_action:
                action: "grant_credits"
                args:
                  amount: "vars.grant"
                  log_message: "'Hero Passive triggered: {hero} releases a warchest of {value} credits for {empire}.'"
