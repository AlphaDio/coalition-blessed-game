module:
  id: "passive_scourge_battle_opening_salvo"
  name: "Opening Salvo"
  description: "Deal immediate damage to Scourge manpower at battle start."
  version: "1.1.0"
  type: "hero_passive"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "passive", "battle", "scourge"]
  created_at: "2026-02-06T00:00:00Z"

schema_version: "0.1"

declares:
  hero_passive_data:
    id: "PASSIVE_SCOURGE_BATTLE_OPENING_SALVO"
    description: "Deal immediate damage to Scourge manpower at battle start."
    trigger:
      type: "BATTLE_STARTED"
      battle_type: "SCOURGE"

hooks:
  on_trigger:
    description: "Reduce Scourge manpower at battle start."
    logic:
      - set_variable:
          varName: "pct"
          value: "0.06 * scope.popularity_scalar"
      - if:
          condition: "vars.pct > 0"
          then:
            - game_action:
                action: "add_scourge_manpower_damage_pct"
                args:
                  amount: "vars.pct"
                  percent: "vars.pct * 100"
                  log_message: "'Hero Passive triggered: {hero} strikes early, reducing Scourge manpower by {percent}%.'"
