module:
  id: "passive_fallout_start_credit_grant"
  name: "Fallout Credit Grant"
  description: "Grant credits to the hero empire at the start of Fallout."
  version: "1.0.0"
  type: "hero_passive"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "passive", "economy", "fallout"]
  created_at: "2026-02-01T00:00:00Z"

schema_version: "0.1"

declares:
  hero_passive_data:
    id: "PASSIVE_FALLOUT_START_CREDIT_GRANT"
    phase: "FALLOUT"
    cadence: "OnStart"
    description: "Grant credits to the hero empire at the start of Fallout."

hooks:
  on_trigger:
    description: "Grant credits to the hero empire at the start of Fallout."
    logic:
      - set_variable:
          varName: "grant"
          value: "round(1000 * scope.popularity_scalar)"
      - if:
          condition: "vars.grant > 0"
          then:
            - game_action:
                action: "grant_credits"
                args:
                  amount: "vars.grant"
                  log_message: "'Hero Passive triggered: {hero} granted {value} credits to {empire}.'"
