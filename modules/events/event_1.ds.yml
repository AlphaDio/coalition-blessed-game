module:
  id: "event_1"
  name: "Supply Convoy Attacked"
  description: "A supply convoy has been ambushed by Scourge forces"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["supplies", "scourge", "combat"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_1"
    name: "Supply Convoy Attacked"
    description: "A supply convoy has been ambushed by Scourge forces. How do you respond?"
    choices:
      - text: "Send reinforcements (lose supplies, gain approval)"
        effects:
          stockpiles:
            supplies: -100
          empireApproval:
            empire_1: 5
            empire_2: 5
            empire_3: 5
      - text: "Abandon convoy (lose approval, save resources)"
        effects:
          empireApproval:
            empire_1: -10
            empire_2: -10
            empire_3: -10
      - text: "Negotiate with local forces (uncertain outcome)"
        effects:
          coalitionCohesion: "random"
          scourgeCohesion: "random"
