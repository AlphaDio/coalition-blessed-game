module:
  id: "passive_debate_tick_orator"
  name: "Debate Orator"
  description: "Boost momentum slightly each debate tick if the law aligns with hero domain."
  version: "1.0.0"
  type: "hero_passive"
  category: "hero"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["hero", "passive", "debate", "momentum"]
  created_at: "2026-02-01T00:00:00Z"

schema_version: "0.1"

declares:
  hero_passive_data:
    id: "PASSIVE_DEBATE_TICK_ORATOR"
    phase: "DEBATE"
    cadence: "OnTick"
    description: "Boost momentum slightly each debate tick if the law aligns with hero domain."

hooks:
  on_trigger:
    description: "Apply momentum when hero and law tags intersect."
    logic:
      - set_variable:
          varName: "has_match"
          value: "intersects(scope.law_tags, scope.hero_tags)"
      - if:
          condition: "vars.has_match"
          then:
            - set_variable:
                varName: "bonus"
                value: "0.02 * scope.popularity_scalar"
            - if:
                condition: "vars.bonus > 0"
                then:
                  - game_action:
                      action: "add_law_momentum"
                      args:
                        amount: "vars.bonus"
                        percent: "vars.bonus * 100"
                        log_message: "'Hero Passive triggered: {hero} orates (+{percent}% momentum).'"
