module:
  id: "event_5"
  name: "Resource Discovery"
  description: "A new resource cache has been discovered"
  version: "1.0.0"
  type: "event"
  category: "economy"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["resources", "discovery", "economy"]
  created_at: "2026-01-16T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_5"
    name: "Requisition Discovery"
    description: "A cache of coalition requisition funds has been discovered."
    choices:
      - text: "Secure immediately (gain requisition)"
        effects:
          coalitionEconomy:
            requisition: 200
      - text: "Distribute to struggling allies (gain approval from weaker empires)"
        effects:
          coalitionEconomy:
            requisition: 50
          empireApproval:
            "@poorest": 12
      - text: "Reward strong partners (incentivize wealthy allies)"
        effects:
          coalitionEconomy:
            requisition: 75
          empireApproval:
            "@richest": 10

