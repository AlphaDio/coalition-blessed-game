module:
  id: "event_scourge_intel_loss"
  name: "Lost Scout Team"
  description: "Coalition reconnaissance forces have been eliminated"
  version: "1.0.0"
  type: "event"
  category: "crisis"
  dependencies: []

metadata:
  author: "Coalition Team"
  tags: ["scourge", "loss", "intelligence"]
  created_at: "2026-01-26T00:00:00Z"

schema_version: "0.1"

declares:
  event_data:
    id: "event_scourge_intel_loss"
    name: "Lost Scout Team"
    description: "Grim news from the front. An entire reconnaissance team was ambushed and eliminated by Scourge forces. Our ability to predict Scourge movements has been compromised."
    choices:
      - text: "Emergency Reconstruction"
        description: "Immediately recruit and train replacement scouts, establish new observation posts, and honor the fallen with a proper memorial. Costly but minimizes capability loss."
        effects_summary: "Cost: 100 requisition | Prediction confidence: -12% (minimized)"
        effects:
          coalitionEconomy:
            requisition: -100
          scourgePredictionConfidence: -0.12
      - text: "Request Allied Volunteers"
        description: "Call upon member empires to temporarily assign their own scouts to Coalition service. Maintains capability but some empires resent the imposition."
        effects_summary: "Cost: Free | Prediction confidence: -22% | All empires: -1 approval"
        effects:
          empireApproval:
            "@all": -1
          scourgePredictionConfidence: -0.22
      - text: "Honor and Regroup"
        description: "Hold a memorial service and allow time for organic rebuilding. Significant intelligence impact but avoids rushed decisions."
        effects_summary: "Cost: Free | Prediction confidence: -35%"
        effects:
          scourgePredictionConfidence: -0.35
